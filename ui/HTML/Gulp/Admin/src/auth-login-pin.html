<!doctype html>
<html lang="en">

<head>
    @@include("partials/title-meta.html", {"title": "Login with Pin"})

    @@include('./partials/head-css.html')
</head>

<body>
    <!-- Start Page Content here -->
    <div class="flex min-h-screen items-center p-12.5">
        <div class="container">
            <div class="flex justify-center px-2.5">
                <div class="2xl:w-4/10 md:w-1/2 sm:w-2/3 w-full">
                    <div class="absolute end-0 top-0">
                        <img src="assets/images/auth-card-bg.svg" alt="auth-card-bg" />
                    </div>

                    <div class="absolute start-0 bottom-0 rotate-180">
                        <img src="assets/images/auth-card-bg.svg" alt="auth-card-bg" />
                    </div>
                    <div class="card p-7.5 rounded-2xl">
                        <!-- Auth Brand Logo -->
                        <div class="mb-3 flex flex-col items-center justify-center text-center">
                            <a href="index.html" class="auth-logo">
                                <img src="assets/images/logo-black.png" alt="logo" class="flex dark:hidden" />
                                <img src="assets/images/logo.png" alt="dark logo" class="hidden dark:flex" />
                            </a>

                            <p class="text-default-400 mx-auto mt-6 mb-4 w-full lg:w-3/4">This screen is locked. Enter
                                your PIN to continue.</p>
                        </div>

                        <form action="index.html">
                            <div class="mb-9 text-center">
                                <div class="border-default-300 mx-auto mb-3 size-20 rounded-full border-4">
                                    <img src="assets/images/users/user-1.jpg" class="size-18 rounded-full"
                                        alt="thumbnail" />
                                </div>
                                <h5 class="text-lg">David Dev</h5>
                            </div>

                            <div class="mb-5">
                                <label for="userEmail" class="form-label">
                                    Enter your 6-digit code
                                    <span class="text-danger">*</span>
                                </label>

                                <div class="two-factor flex gap-2">
                                    <input type="text" class="form-input text-center" required="" inputmode="numeric"
                                        maxlength="1" />
                                    <input type="text" class="form-input text-center" required="" inputmode="numeric"
                                        maxlength="1" />
                                    <input type="text" class="form-input text-center" required="" inputmode="numeric"
                                        maxlength="1" />
                                    <input type="text" class="form-input text-center" required="" inputmode="numeric"
                                        maxlength="1" />
                                    <input type="text" class="form-input text-center" required="" inputmode="numeric"
                                        maxlength="1" />
                                    <input type="text" class="form-input text-center" required="" inputmode="numeric"
                                        maxlength="1" />
                                </div>
                            </div>

                            <div>
                                <button type="submit"
                                    class="btn bg-primary w-full py-3 font-semibold text-white hover:bg-primary-hover">Confirm</button>
                            </div>
                        </form>

                        <p class="text-default-400 mt-7.5 text-center">
                            Not you? Return to
                            <a href="auth-sign-in.html"
                                class="text-primary font-semibold underline underline-offset-4">Sign in</a>
                        </p>
                    </div>

                    <!-- Auth Footer -->
                    <p class="text-default-400 mt-7.5 text-center">
                        &copy;
                        <span data-current-year></span>
                        Paces - by
                        <span>Coderthemes</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <!-- End Page content -->

    @@include('./partials/customizer.html')

    <!-- Two Factor Validator Js -->
    <script type="module" src="assets/js/pages/auth-two-factor.js"></script>
</body>

</html>
