<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Bubble Apexchart" }} {{> head-css}}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Bubble Apexchart"}} {{> sidenav }}

            <!-- Start Page Content here -->
            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Bubble Apexchart" }}

                    <div class="container-fluid">
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Simple Bubble Charts</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="simple-bubble" class="apex-charts"></div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">3D Bubble Charts</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="threed-bubble" class="apex-charts"></div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Bubble Charts</h4>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div id="three-bubble" class="apex-charts"></div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
            <!-- End Page content -->
        </div>

        {{> customizer }}

        <!-- Apex Chart Bubble Demo js -->
        <script type="module" src="assets/js/pages/chart-apex-bubble.js"></script>
    </body>
</html>
