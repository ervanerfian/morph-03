<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Bar Charts" }} {{> head-css}}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Bar Charts" }} {{> sidenav }}

            <!-- Start Page Content here -->
            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Bar Charts" }}

                    <div class="container-fluid">
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Basic Bar</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="basic-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Border Radius</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="border-radius-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Floating</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="floating-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Horizontal</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="horizontal-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Stacked</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="stacked-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Stacked with Groups</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="stacked-groups-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">Vertical</h5>
                                </div>
                                <div class="card-body">
                                    <div dir="ltr">
                                        <div class="mt-3" style="height: 300px">
                                            <canvas id="vertical-bar-chart"></canvas>
                                        </div>
                                    </div>
                                </div>
                                <!-- end card body-->
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
            <!-- End Page content -->
        </div>

        {{> customizer }}

        <!-- Apex Chart Area Demo js -->
        <script type="module" src="assets/js/pages/chartjs-bar.js"></script>
    </body>
</html>
