<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Line Echart" }} {{> head-css}}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Line Echart" }} {{> sidenav }}

            <!-- Start Page Content here -->
            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Line Echart" }}

                    <div class="container-fluid">
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Line Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line" style="min-height: 300px"></div>
                                </div>
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Line Stacked Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line-stacked" style="min-height: 300px"></div>
                                </div>
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Line Marker</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line-marker" style="min-height: 300px"></div>
                                </div>
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Dynamic Line</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-dynamic-line" style="min-height: 300px"></div>
                                </div>
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Step Line</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-step-line" style="min-height: 300px"></div>
                                </div>
                            </div>
                            <!-- end card -->

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Line Y Category</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-line-y-category" style="min-height: 300px"></div>
                                </div>
                            </div>
                            <!-- end card -->
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
            <!-- End Page content -->
        </div>

        {{> customizer }}

        <!-- Apex Chart Area Demo js -->
        <script type="module" src="assets/js/pages/chart-echart-line.js"></script>
    </body>
</html>
