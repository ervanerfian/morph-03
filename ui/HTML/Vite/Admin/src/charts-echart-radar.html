<!doctype html>
<html lang="en">
    <head>
        {{> title-meta title="Radar Echart" }} {{> head-css}}
    </head>

    <body>
        <div class="wrapper">
            {{> topbar subtitle="Charts" title="Radar Echart"}} {{> sidenav }}

            <!-- Start Page Content here -->
            <div class="page-content">
                <main>
                    {{> page-title subtitle="Charts" title="Radar Echart" }}

                    <div class="container-fluid">
                        <div class="grid xl:grid-cols-2 gap-base">
                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Basic Radar Chart</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-basic-radar" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <h4 class="card-title">Proportion of Browsers</h4>
                                </div>
                                <div class="card-body">
                                    <div id="chart-radar1" style="min-height: 300px"></div>
                                </div>
                            </div>

                            <div class="col-span-2">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">Customized Radar Chart</h4>
                                    </div>
                                    <div class="card-body">
                                        <div id="chart-radar2" style="min-height: 300px"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- end col -->

                            <div class="col-span-2">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">Multiple Radar Chart</h4>
                                    </div>
                                    <div class="card-body">
                                        <div id="chart-radar3" style="min-height: 300px"></div>
                                    </div>
                                </div>
                            </div>
                            <!-- end col -->
                        </div>
                    </div>
                </main>

                {{> footer }}
            </div>
            <!-- End Page content -->
        </div>

        {{> customizer }}

        <!-- E Charts Demo js -->
        <script type="module" src="assets/js/pages/chart-echart-radar.js"></script>
    </body>
</html>
